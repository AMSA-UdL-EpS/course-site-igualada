<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AMSA systems administration logo">
  <title>AMSA</title>
  <desc>Minimal line-art logo representing systems administration with a terminal, servers, network, cloud, storage and automation.</desc>

  <g fill="none" stroke="#8A1232" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- Network structure -->
    <path d="M256 157V205"/>
    <path d="M256 205H132V245"/>
    <path d="M256 205H380V245"/>
    <path d="M256 335V390"/>
    <path d="M164 335H108V365"/>
    <path d="M348 335H404V365"/>

    <!-- Terminal -->
    <rect x="158" y="54" width="196" height="103" rx="16"/>
    <path d="M183 91l28 21-28 21"/>
    <path d="M226 133h32"/>

    <!-- Central server stack -->
    <rect x="190" y="204" width="132" height="39" rx="9"/>
    <rect x="190" y="252" width="132" height="39" rx="9"/>
    <rect x="190" y="300" width="132" height="39" rx="9"/>
    <circle cx="209" cy="223" r="4" fill="#8A1232"/>
    <circle cx="209" cy="271" r="4" fill="#8A1232"/>
    <circle cx="209" cy="319" r="4" fill="#8A1232"/>
    <path d="M231 223h66M231 271h66M231 319h66"/>

    <!-- Cloud -->
    <path d="M351 285
             c-18 0-32-12-32-29
             c0-16 12-29 28-31
             c5-25 27-42 53-42
             c25 0 46 16 52 39
             c4-1 8-2 12-2
             c22 0 40 17 40 39
             c0 22-18 39-40 39z"/>

    <!-- Container / compute nodes -->
    <rect x="70" y="365" width="76" height="47" rx="8"/>
    <rect x="83" y="348" width="50" height="22" rx="5"/>
    <path d="M89 383h38M89 397h38"/>

    <!-- Storage -->
    <ellipse cx="404" cy="386" rx="42" ry="16"/>
    <path d="M362 386v43c0 9 19 16 42 16s42-7 42-16v-43"/>
    <path d="M362 407c0 9 19 16 42 16s42-7 42-16"/>

    <!-- Automation gear -->
    <circle cx="256" cy="414" r="34"/>
    <circle cx="256" cy="414" r="12"/>
    <path d="M256 370v12M256 446v12M212 414h12M288 414h12
             M225 383l9 9M278 436l9 9M225 445l9-9M278 392l9-9"/>

    <!-- Small network nodes -->
    <circle cx="132" cy="205" r="7" fill="#fff"/>
    <circle cx="380" cy="205" r="7" fill="#fff"/>
    <circle cx="256" cy="205" r="7" fill="#fff"/>
    <circle cx="108" cy="365" r="7" fill="#fff"/>
    <circle cx="404" cy="365" r="7" fill="#fff"/>

  </g>

  <!-- Small neutral details -->
  <g fill="#8A1232">
    <circle cx="169" cy="177" r="4"/>
    <circle cx="343" cy="177" r="4"/>
    <rect x="130" y="235" width="7" height="7" rx="2"/>
    <rect x="375" y="235" width="7" height="7" rx="2"/>
  </g>
</svg>
